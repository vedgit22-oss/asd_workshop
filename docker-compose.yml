services:
  postgres:
    image: postgres:16
    container_name: asd-workshop-postgres
    environment:
      POSTGRES_USER: workshop
      POSTGRES_PASSWORD: workshop
      POSTGRES_DB: workshop
    ports:
      - "5433:5432"
    volumes:
      - asd_workshop_pg_data:/var/lib/postgresql/data

volumes:
  asd_workshop_pg_data:
